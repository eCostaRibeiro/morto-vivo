<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morto-Vivo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header"><h1><span aria-hidden="true">🧟‍♂️🔗</span> Morto-Vivo</h1></header>

  <main class="container">
    <div class="text-field">
      <label for="listaUrls">Cole as URLs (uma por linha — aceita hxxp / [.] de relatórios):</label>
      <textarea id="listaUrls" aria-describedby="urlHint" placeholder="https://google.com&#10;hxxps://site-falso[.]top/login&#10;https://www.olx.com.br/d/anuncio-...&#10;https://www.instagram.com/perfil_falso/"></textarea>
      <p class="hint" id="urlHint">Uma URL por linha. URLs com hxxp e [.] também são aceitas.</p>
    </div>

    <details>
      <summary>Opções</summary>
      <label class="opt"><input type="checkbox" id="tabMode" aria-labelledby="tabModeLabel" aria-describedby="tabModeHelp">
        <span><span id="tabModeLabel">Modo aba para Shopee, Instagram, Facebook, X, TikTok…</span><small id="tabModeHelp">Recomendado para Facebook: abre a página em segundo plano e lê o conteúdo renderizado. Usa a SUA sessão logada (use um perfil de Chrome dedicado). Nunca é usado em domínios desconhecidos nem no LinkedIn.</small></span></label>
      <label class="opt"><input type="checkbox" id="completionNotification" aria-labelledby="completionNotificationLabel" aria-describedby="completionNotificationHelp">
        <span><span id="completionNotificationLabel">Notificação do navegador ao concluir o monitoramento</span><small id="completionNotificationHelp">Opcional. O navegador pedirá permissão ao ativar. O aviso dentro da tela de resultados continua disponível.</small></span></label>
      <button class="link" id="btnLimpar" type="button">Limpar histórico de verificações</button>
    </details>

    <button id="btnVerificar">Verificar Status</button>
    <div id="storageNotice" class="error-box" role="alert" aria-atomic="true" hidden></div>
    <div id="resultados"></div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>

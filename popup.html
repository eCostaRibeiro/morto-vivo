<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --md-primary: #6750A4;
      --md-on-primary: #FFFFFF;
      --md-surface: #FEF7FF;
      --md-on-surface: #1D1B20;
      --md-outline: #79747E;
      --md-error: #B3261E;
      --md-surface-container: #F3EDF7;
    }
    body { width: 370px; margin: 0; background-color: var(--md-surface); color: var(--md-on-surface); font-family: 'Roboto', 'Segoe UI', Tahoma, sans-serif; }
    .header { background-color: var(--md-primary); color: var(--md-on-primary); padding: 16px; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24); }
    .container { padding: 16px; }
    .text-field { display: flex; flex-direction: column; margin-bottom: 12px; }
    .text-field label, summary { font-size: 12px; margin-bottom: 6px; font-weight: 500; }
    textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--md-outline); border-radius: 4px; padding: 10px; font-family: inherit; font-size: 12px; resize: vertical; background: transparent; color: var(--md-on-surface); }
    #listaUrls { height: 110px; }
    textarea:focus { outline: 2px solid var(--md-primary); border-color: transparent; }
    button#btnVerificar { width: 100%; padding: 10px 24px; cursor: pointer; background-color: var(--md-primary); color: var(--md-on-primary); border: none; border-radius: 20px; font-size: 14px; font-weight: 500; transition: background-color .2s; }
    button#btnVerificar:hover { background-color: #553f88; }
    .opt { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; margin: 6px 0; line-height: 1.35; }
    .opt input { margin-top: 2px; }
    .opt small { color: var(--md-outline); display: block; }
    details { background: var(--md-surface-container); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
    summary { cursor: pointer; margin: 0; }
    .opt + .opt { margin-top: 10px; }
    .hint { font-size: 11px; color: var(--md-outline); margin: 6px 0 0; line-height: 1.4; }
    .error-box { margin-top: 12px; padding: 12px; border-radius: 8px; background-color: #FDECEA; color: var(--md-error); border: 1px solid #F5C6CB; font-size: 13px; line-height: 1.5; white-space: pre-line; max-height: 120px; overflow-y: auto; }
    .link { background: none; border: none; color: var(--md-primary); font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">🧟‍♂️🔗 Morto-Vivo</div>

  <div class="container">
    <div class="text-field">
      <label for="listaUrls">Cole as URLs (uma por linha — aceita hxxp / [.] de relatórios):</label>
      <textarea id="listaUrls" placeholder="https://google.com&#10;hxxps://site-falso[.]top/login&#10;https://www.olx.com.br/d/anuncio-...&#10;https://www.instagram.com/perfil_falso/"></textarea>
    </div>

    <details>
      <summary>Opções</summary>
      <label class="opt"><input type="checkbox" id="tabMode">
        <span>Modo aba para Shopee, Instagram, Facebook, X, TikTok…<small>Recomendado para Facebook: abre a página em segundo plano e lê o conteúdo renderizado. Usa a SUA sessão logada (use um perfil de Chrome dedicado). Nunca é usado em domínios desconhecidos nem no LinkedIn.</small></span></label>
      <label class="opt"><input type="checkbox" id="completionNotification">
        <span>Notificação do navegador ao concluir o monitoramento<small>Opcional. O navegador pedirá permissão ao ativar. O aviso dentro da tela de resultados continua disponível.</small></span></label>
      <button class="link" id="btnLimpar" type="button">Limpar histórico de verificações</button>
    </details>

    <button id="btnVerificar">Verificar Status</button>
    <div id="storageNotice" class="error-box" role="alert" style="display:none;"></div>
    <div id="resultados"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
